; Raises PHP's own upload ceiling to match the 15 MB app-level limit in
; admin/fields.php's handle_upload(). Only takes effect on PHP-FPM/CGI
; hosting (most shared hosts) — ignored harmlessly otherwise. Ops via
; mod_php should instead set these in httpd/vhost config or php.ini.
upload_max_filesize = 20M
post_max_size = 20M
