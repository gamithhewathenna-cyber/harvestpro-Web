; Raises PHP's own upload ceiling to match the 15 MB app-level limit in
; admin/fields.php's handle_upload(). post_max_size is bigger than a single
; file's cap because the News post editor can submit two files at once
; (featured image + a .docx to import) in the same request. Only takes
; effect on PHP-FPM/CGI hosting (most shared hosts) — ignored harmlessly
; otherwise. Ops via mod_php should instead set these in httpd/vhost config
; or php.ini.
upload_max_filesize = 20M
post_max_size = 40M
